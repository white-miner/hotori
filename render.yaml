# Render Blueprint: HOTORI 휴대폰 확인용 데모 (무료 웹 서비스)
# 무료 인스턴스는 디스크가 임시라서 재배포·재시작·유휴 종료 때마다 가상 데모 데이터로 다시 시작합니다.
services:
  - type: web
    name: hotori
    runtime: node
    plan: free
    region: singapore
    # tsx(서버 실행기)가 devDependencies에 있으므로 NODE_ENV와 상관없이 개발 의존성까지 설치합니다.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # Blueprint를 처음 만들 때 Render 화면에서 직접 입력합니다. 저장소에는 넣지 않습니다.
      - key: HOTORI_ACCESS_PASSWORD
        sync: false
