# Render Blueprint: HOTORI 휴대폰 확인용 데모 (무료 웹 서비스)
# 무료 인스턴스는 디스크가 임시라서 재배포·재시작·유휴 종료 때마다 가상 데모 데이터로 다시 시작합니다.
services:
  - type: web
    name: hotori
    runtime: node
    plan: free
    region: singapore
    # 빌드 도구가 devDependencies에 있으므로 개발 의존성까지 설치합니다.
    # npm run build = 화면 빌드 + 서버를 JS로 미리 변환(dist-server) + DB 폴더 미리 만들기(initdb).
    # 메모리를 많이 쓰는 작업은 모두 빌드 단계에서 끝내고, 512MB 서버는 node로 바로 실행합니다.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node --max-old-space-size=192 dist-server/index.js
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # Blueprint를 처음 만들 때 Render 화면에서 직접 입력합니다. 저장소에는 넣지 않습니다.
      - key: HOTORI_ACCESS_PASSWORD
        sync: false
