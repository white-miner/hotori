# Render Blueprint: HOTORI v3 예약 장부 (무료 웹 서비스)
# 데이터와 로그인은 Supabase에 있어서 서버가 잠들거나 다시 시작해도 기록이 사라지지 않아요.
services:
  - type: web
    name: hotori
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist-server/index.js
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      # 브라우저용 공개 설정 (.env.production에도 같은 값이 있어요). 비밀 키는 넣지 않아요.
      - key: VITE_SUPABASE_URL
        value: https://pzhwhtptwsehjtzdyywq.supabase.co
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_25-W_uwp-9ooOr1MYWmOGQ_baNqtcpc
      # 선택: 공용 비밀번호(Basic Auth). 값을 지우면 로그인 화면만 보여요.
      - key: HOTORI_ACCESS_PASSWORD
        sync: false
